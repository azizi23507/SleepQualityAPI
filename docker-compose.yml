services:
  # db service → creates the database (name, user, password from .env)
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api: # api service → connects to it, using DATABASE_URL written in the compose file (password from .env)
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/sleep_quality_api
      API_KEY: ${API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: